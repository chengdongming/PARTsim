# RTA4 CORE-3 simulation support base energy envelope.
# ProductionSimulationExecutor overrides physical_initial_energy and
# battery_capacity from each CORE-3 plan record before execution.
# This file is not a formal experiment result and does not authorize execution.
initial_energy_values: ["0", "1/20", "1"]
simulation_initial_battery: "1"
required_safety_margin: "1"
exact_rational_encoding: canonical_fraction
service_curve:
  id: paired-real-solar-service-v2-dyadic-1-128
  system_template: system_config_unified_template.yml
  horizon: 30000
  require_real_solar_data: true
  raw_reference_pv_area_m2: "1"
  solar_scale: "1/128"
  dyadic_scale_selection:
    rule: largest_feasible_dyadic_v1
    reference_initial_battery: "1"
    reference_battery_capacity: "20"
    required_safety_margin: "1"
battery_mode: finite
battery_capacity: "20"
